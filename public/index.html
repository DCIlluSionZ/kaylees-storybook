<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff8ec7" />
  <title>Kaylee's Magical Storybook</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="sparkle-layer" aria-hidden="true"></div>

  <main class="storybook">
    <header class="storybook__header">
      <h1>Kaylee's Magical Storybook</h1>
      <p class="scene-label" id="scene-label">A New Adventure</p>
    </header>

    <section class="story-card" aria-live="polite">
      <div class="story-text" id="story-text">
        Hi Kaylee! Press the big pink button to begin your magical adventure with Lucy the fairy.
      </div>

      <div class="controls">
        <button type="button" class="control-btn" id="replay-btn" title="Read it again" aria-label="Read it again">
          <span class="control-icon">&#128266;</span>
          <span>Read Again</span>
        </button>
        <button type="button" class="control-btn" id="mute-btn" title="Mute or unmute" aria-label="Mute or unmute">
          <span class="control-icon" id="mute-icon">&#128263;</span>
          <span id="mute-label">Sound On</span>
        </button>
      </div>
    </section>

    <section class="choices" id="choices" aria-label="What does Kaylee do next?">
      <button type="button" class="start-btn" id="start-btn">
        <span class="start-btn__sparkle">&#10024;</span>
        Start the Adventure
        <span class="start-btn__sparkle">&#10024;</span>
      </button>
    </section>

    <div class="loader" id="loader" hidden>
      <div class="loader__wand">&#128302;</div>
      <p>Lucy is sprinkling story magic...</p>
    </div>

    <footer class="storybook__footer">
      <button type="button" class="restart-btn" id="restart-btn" hidden>Start Over</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
